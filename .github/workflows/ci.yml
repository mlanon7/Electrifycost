name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The full 9-stage gate, same as local: validate-csvs, validate-risk-events,
      # validate-pages, validate-content, smoke-test, new-calc-tests,
      # test-montecarlo, test-sim-state, build-scenario-bands --check.
      - name: npm test (all validators + test stages)
        run: npm test

      - name: Type check
        run: npx tsc --noEmit

      - name: Astro build (verify clean production build)
        run: npm run build

      - name: Confirm sitemap generated
        run: |
          if [ ! -f dist/sitemap.xml ] && [ ! -f dist/sitemap-0.xml ] && [ ! -f dist/sitemap-index.xml ]; then
            echo "No sitemap.xml found in dist/"
            ls -la dist/ | head -20
            exit 1
          fi
          echo "Sitemap present."
