name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate CSVs
        run: node scripts/validate-csvs.cjs

      - name: Validate pages (Layout + section balance)
        run: node scripts/validate-pages.cjs

      - name: Smoke tests
        run: node scripts/smoke-test.cjs

      - name: New calculator assertions
        run: node scripts/new-calc-tests.cjs

      - name: Astro build (verify clean production build)
        run: npm run build

      - name: Confirm sitemap generated
        run: |
          if [ ! -f dist/sitemap.xml ] && [ ! -f dist/sitemap-0.xml ] && [ ! -f dist/sitemap-index.xml ]; then
            echo "No sitemap.xml found in dist/"
            ls -la dist/ | head -20
            exit 1
          fi
          echo "Sitemap present."
